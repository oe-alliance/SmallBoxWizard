sonar.projectKey=oe-alliance_SmallBoxWizard
sonar.organization=oe-alliance

# This is the name displayed in the SonarCloud UI, the version is SMALLBOX_WIZARD_VERSION of include/version.h.
sonar.projectName=OE-Alliance SmallBox Wizard

sonar.sourceEncoding=UTF-8

# LVGL is a submodule and the fonts are generated.
sonar.exclusions=lib/**,src/fonts/**

# The wizard has no unit tests, the coverage is not measured.
sonar.coverage.exclusions=**/*

# Rules that do not fit a first-boot tool that runs as root on the receiver.
sonar.issue.ignore.multicriteria=e1,e2,e3
# Log injection: the wizard writes only its own logs.
sonar.issue.ignore.multicriteria.e1.ruleKey=csecurity:S5145
sonar.issue.ignore.multicriteria.e1.resourceKey=src/**
# Publicly writable directories: the markers and work folders in /tmp belong to the wizard.
sonar.issue.ignore.multicriteria.e2.ruleKey=c:S5443
sonar.issue.ignore.multicriteria.e2.resourceKey=src/**
# File permissions: the files are for root on the receiver.
sonar.issue.ignore.multicriteria.e3.ruleKey=c:S2612
sonar.issue.ignore.multicriteria.e3.resourceKey=src/**
